version: '3.8'

services:
  db:
    image: postgres:15
    container_name: kingspan-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kingspan
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kingspan-api
    ports:
      - '3333:3333'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kingspan
      JWT_SECRET: kingspan-secret-2026
      JWT_EXPIRES_IN: 7d
      PORT: 3333
    depends_on:
      - db

volumes:
  pgdata: